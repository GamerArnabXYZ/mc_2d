apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    ndkVersion "26.3.11579264"
    namespace "com.gax.mc2d"

    defaultConfig {
        applicationId "com.gax.mc2d"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                // ClassiCube uses c++_static — same here
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file('keystore.properties')
            if (f.exists()) props.load(new FileInputStream(f))
            storeFile     file(props.getProperty('storeFile',     'mc2d.keystore'))
            keyAlias      props.getProperty('keyAlias',           'mc2d')
            storePassword props.getProperty('storePassword',      'android123')
            keyPassword   props.getProperty('keyPassword',        'android123')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug { debuggable true }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    externalNativeBuild {
        cmake {
            // ClassiCube uses 3.10.2 but that's not installed
            // Use the one that IS available in Android SDK on ubuntu-22.04
            version '3.22.1'
            path 'CMakeLists.txt'
        }
    }

    sourceSets {
        main { assets.srcDirs = ['src/main/assets'] }
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        def abiName = abi ?: "universal"
        output.outputFileName = "MC2D-${variant.versionName}-${abiName}-${variant.buildType.name}.apk"
    }
}
