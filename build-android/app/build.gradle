plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('gradle.properties')
if (keystoreFile.exists()) {
    keystoreProps.load(new FileInputStream(keystoreFile))
}

android {
    compileSdk 34
    ndkVersion "26.3.11579264"
    namespace "com.gax.mc2d"

    defaultConfig {
        applicationId "com.gax.mc2d"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    signingConfigs {
        release {
            storeFile     file(keystoreProps['RELEASE_STORE_FILE'] ?: 'mc2d-release.keystore')
            keyAlias      keystoreProps['RELEASE_KEY_ALIAS']      ?: 'mc2d'
            storePassword keystoreProps['RELEASE_STORE_PASSWORD'] ?: 'android123'
            keyPassword   keystoreProps['RELEASE_KEY_PASSWORD']   ?: 'android123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug { debuggable true }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            // FIX: Force CMake 3.28+ so Raylib 6.0 (requires 3.25) works
            version "3.28.0+"
        }
    }

    sourceSets {
        main { assets.srcDirs = ['src/main/assets'] }
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        def abiName = abi ?: "universal"
        output.outputFileName = "MC2D-${variant.versionName}-${abiName}-${variant.buildType.name}.apk"
    }
}
