<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CraftSDL — 2D Sandbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
    overflow: hidden;
    touch-action: none;
  }

  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #loading h1 {
    font-size: 2rem;
    color: #4ade80;
    text-shadow: 0 0 20px #4ade80;
  }

  #loading p { font-size: 0.9rem; color: #888; }

  .progress-bar {
    width: 260px; height: 16px;
    background: #333;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #4ade80;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    width: 0%;
    transition: width 0.3s;
    border-radius: 8px;
  }

  canvas {
    display: none;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    image-rendering: pixelated;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  #status {
    position: fixed;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: #4ade80;
    font-size: 0.7rem;
    padding: 4px 12px;
    border-radius: 12px;
    display: none;
  }
</style>
</head>
<body>

<div id="loading">
  <h1>⛏️ CraftSDL</h1>
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
  <p id="loadText">Loading WASM...</p>
</div>

<canvas id="canvas"></canvas>
<div id="status" id="status"></div>

<script>
  // ── Emscripten Module config ─────────────────────────────────────────────
  var Module = {
    canvas: (function() { return document.getElementById('canvas'); })(),

    setStatus: function(text) {
      var loadText = document.getElementById('loadText');
      var prog     = document.getElementById('prog');
      var status   = document.getElementById('status');
      if (loadText) loadText.textContent = text || 'Running...';
      if (!text && prog) {
        // Loading done
        document.getElementById('loading').style.display = 'none';
        document.getElementById('canvas').style.display  = 'block';
        if (status) {
          status.style.display = 'block';
          status.textContent   = 'CraftSDL Running';
          setTimeout(() => { status.style.display = 'none'; }, 2000);
        }
      }
    },

    monitorRunDependencies: function(left) {
      var prog = document.getElementById('prog');
      if (prog && left > 0) {
        prog.style.width = Math.max(10, (100 - left * 5)) + '%';
      }
    },

    onRuntimeInitialized: function() {
      var prog = document.getElementById('prog');
      if (prog) prog.style.width = '100%';
    },

    print:    function(t) { console.log(t); },
    printErr: function(t) { console.warn(t); }
  };

  // ── Prevent context menu on right-click / long-press ────────────────────
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
</script>

<!-- Emscripten generated JS (output name = CraftSDL.js) -->
{{{ SCRIPT }}}

</body>
</html>
