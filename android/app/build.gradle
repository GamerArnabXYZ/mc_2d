plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arnablabz.mc2d'
    compileSdk 34

    defaultConfig {
        applicationId "com.arnablabz.mc2d"
        minSdk         21
        targetSdk      34
        versionCode    1
        versionName    "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cFlags   "-std=c99 -O2 -DPLATFORM_ANDROID -DGRAPHICS_API_OPENGL_ES2"
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_PLATFORM=android-21"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path    "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled   false
            signingConfig   signingConfigs.debug
            proguardFiles   getDefaultProguardFile('proguard-android-optimize.txt'),
                            'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    /* No extra dependencies — pure native */
}
