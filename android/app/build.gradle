// ─── App build.gradle (Gradle 9 / AGP 8.x compatible) ────────────────────────
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.craftsdl.game'
    compileSdk 34

    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.craftsdl.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
                // SDL deps are resolved via add_subdirectory in cmake/Android.cmake
                // deps/ folder is at repo root (rootDir/../)
                arguments "-DANDROID=ON"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "${rootDir}/../CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Use debug signing for CI; replace with real keystore for production
            signingConfig signingConfigs.debug
        }
        debug {
            jniDebuggable true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ["${rootDir}/../assets"]
            java.srcDirs   = ['src/main/java']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
