apply plugin: 'com.android.application'

android {
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.craftsdl.game"
        minSdk 21          // Android 5.0+
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
                arguments "-DANDROID=ON",
                          "-DSDL2_SOURCE_DIR=${project.rootDir}/../deps/SDL2"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug  // replace with keystore for prod
        }
        debug {
            jniDebuggable true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
            java.srcDirs   = ['src/main/java']
        }
    }
}

dependencies {
    // No Java deps needed — pure NDK
}
