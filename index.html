<!doctypehtml><html lang=en><head><meta charset=UTF-8><meta content="width=device-width,initial-scale=1,user-scalable=no"name=viewport><title>MC2D — ArnabLabZ</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;display:flex;align-items:center;justify-content:center;height:100vh;font-family:monospace;color:#eee;overflow:hidden}canvas{display:block;image-rendering:pixelated;touch-action:none}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a2e;z-index:99}#bar{width:280px;height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:14px}#fill{height:100%;background:#64c8ff;width:0%;transition:width .3s}#info{margin-top:8px;font-size:.75rem;color:#888}</style></head><body><canvas id=canvas oncontextmenu=return!1></canvas><div id=loading><div style=text-align:center><div style=font-size:1.3rem>⛏ MC2D Loading…</div><div id=bar><div id=fill></div></div><div id=info>Initializing…</div></div></div><script>var Module={canvas:document.getElementById("canvas"),setStatus:function(e){document.getElementById("info").textContent=e||"Ready",e||(document.getElementById("loading").style.display="none")},monitorRunDependencies:function(e){document.getElementById("fill").style.width=(e?Math.max(0,100-8*e):100)+"%"},onRuntimeInitialized:function(){document.getElementById("loading").style.display="none"}}</script><script async src=index.js></script></body></html>
