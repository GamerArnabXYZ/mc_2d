name: MC Clone Build Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  # Game configuration
  GAME_NAME: mc-clone
  GAME_VERSION: 1.0.0
  NDK_VERSION: r25b
  EMSDK_VERSION: 3.1.32
  ANDROID_API: 24
  ANDROID_BUILD_TOOLS: 33.0.2

jobs:
  # ============================================
  # WEB BUILD - Emscripten + WASM + WebGL
  # ============================================
  build-web:
    name: Build Web (WASM + WebGL)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Emscripten
        id: cache-emsdk
        uses: actions/cache@v3
        with:
          path: |
            ~/emsdk
            ~/.emscripten_cache
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Setup Emscripten
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Build Web Version
        run: |
          source ~/emsdk/emsdk_env.sh
          cd ${{ github.workspace }}

          # Create build directory
          mkdir -p build-web
          cd build-web

          # Configure with CMake for Emscripten
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=WEB \
            -DGAME_NAME=${{ env.GAME_NAME }}

          # Build
          emmake make -j$(nproc)

          # Package for deployment
          mkdir -p deploy
          cp index.html deploy/
          cp *.js deploy/
          cp *.wasm deploy/
          cp *.data deploy/ 2>/dev/null || true

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: build-web/deploy/
          retention-days: 30

  # ============================================
  # ANDROID BUILD - NDK + Gradle
  # ============================================
  build-android:
    name: Build Android (NDK)
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
        include:
          - abi: armeabi-v7a
            artifact_suffix: arm7
          - abi: arm64-v8a
            artifact_suffix: arm64
          - abi: x86_64
            artifact_suffix: x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v3
        with:
          path: |
            ~/android-ndk
            ~/.android/ndk
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip
          unzip -q android-ndk-${{ env.NDK_VERSION }}-linux.zip -d ~/
          rm android-ndk-${{ env.NDK_VERSION }}-linux.zip
          echo "NDK_HOME=~/android-ndk-${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Configure NDK Path
        run: |
          echo "NDK_HOME=~/android-ndk-${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=~/android-ndk-${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Build Android - ${{ matrix.abi }}
        run: |
          cd ${{ github.workspace }}/platforms/android

          # Create native library directory structure
          mkdir -p app/src/main/jniLibs/${{ matrix.abi }}

          # Compile native C code with NDK
          ~/android-ndk-${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++ \
            -target ${{ matrix.abi }}-linux-android24 \
            -sysroot ~/android-ndk-${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot \
            -c ../../src/*.c ../../src/**/*.c \
            -I../../include \
            -I~/android-ndk-${{ env.NDK_VERSION }}/sysroot/usr/include \
            -fPIC -Wall -O2 \
            -o app/src/main/jniLibs/${{ matrix.abi }}/libmc-clone.a

          # Build debug APK
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PABI_FILTER=${{ matrix.abi }} \
            -PNDK_VERSION=${{ env.NDK_VERSION }}

      - name: Rename APK
        run: |
          cd ${{ github.workspace }}/platforms/android
          mv app/build/outputs/apk/debug/*.apk \
             ${{ env.GAME_NAME }}-${{ env.GAME_VERSION }}-${{ matrix.artifact_suffix }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-apk-${{ matrix.artifact_suffix }}
          path: platforms/android/${{ env.GAME_NAME }}-${{ env.GAME_VERSION }}-${{ matrix.artifact_suffix }}.apk
          retention-days: 30

  # ============================================
  # UNIVERSAL APK BUILD
  # ============================================
  build-android-universal:
    name: Build Android Universal APK
    runs-on: ubuntu-22.04
    needs: build-android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Universal APK
        run: |
          cd ${{ github.workspace }}/platforms/android

          # Build all ABIs
          chmod +x gradlew
          ./gradlew assembleDebug

          # Package universal APK with all ABIs
          mkdir -p universal
          cp app/build/outputs/apk/debug/*.apk universal/

      - name: Rename Universal APK
        run: |
          cd ${{ github.workspace }}/platforms/android
          mv universal/*.apk \
             ${{ env.GAME_NAME }}-${{ env.GAME_VERSION }}-universal.apk

      - name: Upload Universal APK
        uses: actions/upload-artifact@v3
        with:
          name: android-apk-universal
          path: platforms/android/${{ env.GAME_NAME }}-${{ env.GAME_VERSION }}-universal.apk
          retention-days: 30

  # ============================================
  # DEPLOY TO GITHUB PAGES (Web)
  # ============================================
  deploy-web:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-22.04
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download Web Artifacts
        uses: actions/download-artifact@v3
        with:
          name: web-build
          path: deploy

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

      - name: Print Deployment URL
        run: |
          echo "🎮 Game deployed to: ${{ steps.deployment.outputs.page_url }}"

  # ============================================
  # RELEASE MANAGEMENT
  # ============================================
  create-release:
    name: Create Release
    runs-on: ubuntu-04
    needs: [build-web, build-android, build-android-universal]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web Artifact
        uses: actions/download-artifact@v3
        with:
          name: web-build
          path: release/web

      - name: Download Android Artifacts
        uses: actions/download-artifact@v3
        with:
          pattern: android-apk-*
          path: release/android

      - name: Create Release Package
        run: |
          mkdir -p release/${{ env.GAME_NAME }}-${{ env.GAME_VERSION }}

          # Copy all release files
          cp -r release/web/* release/${{ env.GAME_NAME }}-${{ env.GAME_VERSION }}/web/
          cp -r release/android/* release/${{ env.GAME_NAME }}-${{ env.GAME_VERSION }}/android/

          # Create release notes
          cat > release/${{ env.GAME_NAME }}-${{ env.GAME_VERSION }}/RELEASE_NOTES.md << EOF
          # ${{ env.GAME_NAME }} v${{ env.GAME_VERSION }}

          ## Downloads
          - **Web**: Extract and host index.html
          - **Android ARM64**: mc-clone-${{ env.GAME_VERSION }}-arm64.apk
          - **Android ARMv7**: mc-clone-${{ env.GAME_VERSION }}-arm7.apk
          - **Android x86_64**: mc-clone-${{ env.GAME_VERSION }}-x86_64.apk
          - **Android Universal**: mc-clone-${{ env.GAME_VERSION }}-universal.apk

          ## Features
          - ✅ Infinite procedural world
          - ✅ WebAssembly + WebGL support
          - ✅ Native Android builds
          - ✅ Zero-crash texture fallback system

          Built with ❤️ using C99 + Raylib
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/${{ env.GAME_NAME }}-${{ env.GAME_VERSION }}/**
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}