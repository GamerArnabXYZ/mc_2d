name: MC2D Build & Release

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages:    write
  id-token: write

env:
  RAYLIB_TAG:   "6.0"
  NDK_VERSION:  "26.3.11579264"
  JAVA_VERSION: "17"

jobs:
# ================================================================
# JOB 1: WebAssembly → gh-pages
# ================================================================
  build-web:
    name: "🌐 WebAssembly (Emscripten)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Cache Raylib Web
        id: cache-raylib-web
        uses: actions/cache@v4
        with:
          path: raylib-web
          key: raylib-${{ env.RAYLIB_TAG }}-emscripten-v9

      - name: Build Raylib for Web
        if: steps.cache-raylib-web.outputs.cache-hit != 'true'
        run: |
          curl -fL \
            "https://github.com/raysan5/raylib/archive/refs/tags/${{ env.RAYLIB_TAG }}.tar.gz" \
            -o raylib.tar.gz
          tar xf raylib.tar.gz
          RDIR=$(ls -d raylib-*/ | head -1)
          echo "Source: $RDIR"
          cd "${RDIR}src"
          emmake make PLATFORM=PLATFORM_WEB RAYLIB_LIBTYPE=STATIC -j$(nproc)
          mkdir -p ../../raylib-web/lib ../../raylib-web/include
          if   [ -f libraylib.web.a ]; then cp libraylib.web.a ../../raylib-web/lib/libraylib.a
          elif [ -f libraylib.a ];     then cp libraylib.a     ../../raylib-web/lib/libraylib.a
          else echo "ERROR: no raylib lib"; ls -la; exit 1; fi
          cp raylib.h raymath.h rlgl.h ../../raylib-web/include/
          echo "✅ $(ls -lh ../../raylib-web/lib/)"

      - name: Create web/shell.html
        run: |
          mkdir -p web
          cat > web/shell.html << 'HTML_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
            <title>MC2D — ArnabLabZ</title>
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              body{background:#1a1a2e;display:flex;align-items:center;
                   justify-content:center;height:100vh;font-family:monospace;color:#eee;overflow:hidden}
              canvas{display:block;image-rendering:pixelated;touch-action:none}
              #loading{position:fixed;inset:0;display:flex;align-items:center;
                       justify-content:center;background:#1a1a2e;z-index:99}
              #bar{width:280px;height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:14px}
              #fill{height:100%;background:#64c8ff;width:0%;transition:width .3s}
              #info{margin-top:8px;font-size:.75rem;color:#888}
            </style>
          </head>
          <body>
            <canvas id="canvas" oncontextmenu="return false"></canvas>
            <div id="loading">
              <div style="text-align:center">
                <div style="font-size:1.3rem">⛏ MC2D Loading…</div>
                <div id="bar"><div id="fill"></div></div>
                <div id="info">Initializing…</div>
              </div>
            </div>
            <script>
              var Module={
                canvas:document.getElementById('canvas'),
                setStatus:function(t){
                  document.getElementById('info').textContent=t||'Ready';
                  if(!t)document.getElementById('loading').style.display='none';
                },
                monitorRunDependencies:function(n){
                  document.getElementById('fill').style.width=(n?Math.max(0,100-n*8):100)+'%';
                },
                onRuntimeInitialized:function(){
                  document.getElementById('loading').style.display='none';
                }
              };
            </script>
            {{{ SCRIPT }}}
          </body>
          </html>
          HTML_EOF

      - name: Build WebAssembly
        run: |
          mkdir -p web/build
          emcc -std=c99 -O2 \
            -Isrc \
            -Iraylib-web/include \
            -DPLATFORM_WEB \
            -s USE_GLFW=3 \
            -s ASYNCIFY=1 \
            -s TOTAL_MEMORY=134217728 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s WASM=1 \
            -s MAX_WEBGL_VERSION=1 \
            -s EXPORTED_RUNTIME_METHODS='["cwrap"]' \
            --shell-file web/shell.html \
            --preload-file assets \
            src/main.c \
            src/world/blocks.c \
            src/world/chunk.c \
            src/world/worldgen.c \
            src/player/player.c \
            src/player/inventory.c \
            src/renderer/textures.c \
            src/renderer/camera.c \
            src/ui/hud.c \
            src/input/input.c \
            raylib-web/lib/libraylib.a \
            -lm \
            -o web/build/index.html
          echo "✅ WASM build:"
          ls -lh web/build/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  ./web/build
          publish_branch: gh-pages
          commit_message: "🌐 MC2D Web Deploy (${{ github.sha }})"

# ================================================================
# JOB 2: Android APKs — ClassiCube-style build
# No FetchContent, No CMake for Raylib
# Raylib compiled directly with NDK clang, .a placed in jni tree
# ================================================================
  build-android:
    name: "🤖 Android APKs (4 ABIs)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}" --sdk_root=$ANDROID_SDK_ROOT
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Cache Raylib Android prebuilt
        id: cache-raylib-android
        uses: actions/cache@v4
        with:
          path: raylib-prebuilt
          key: raylib-${{ env.RAYLIB_TAG }}-android-ndk${{ env.NDK_VERSION }}-classicube-v1

      - name: Build Raylib for Android (NDK clang direct — no CMake)
        if: steps.cache-raylib-android.outputs.cache-hit != 'true'
        run: |
          # Download Raylib source
          curl -fL \
            "https://github.com/raysan5/raylib/archive/refs/tags/${{ env.RAYLIB_TAG }}.tar.gz" \
            -o raylib.tar.gz
          tar xf raylib.tar.gz
          RAYLIB_SRC=$(ls -d "$PWD"/raylib-*/ | head -1)
          RAYLIB_SRC="${RAYLIB_SRC%/}"
          echo "Raylib source: $RAYLIB_SRC"

          NDK_TC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          SYSROOT=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot

          # Raylib source files needed for Android (from official Makefile.Android pattern)
          RAYLIB_C_FILES="rcore.c rshapes.c rtextures.c rtext.c rmodels.c raudio.c"

          mkdir -p raylib-prebuilt/include
          cp "$RAYLIB_SRC/src/raylib.h" \
             "$RAYLIB_SRC/src/raymath.h" \
             "$RAYLIB_SRC/src/rlgl.h"   \
             raylib-prebuilt/include/

          for ABI in armeabi-v7a arm64-v8a x86_64; do
            echo "=== Compiling Raylib for $ABI ==="
            mkdir -p "raylib-prebuilt/$ABI"
            OBJ_DIR="raylib-prebuilt/$ABI/obj"
            mkdir -p "$OBJ_DIR"

            # Pick correct clang target (same as Makefile.Android)
            case "$ABI" in
              armeabi-v7a) CC="$NDK_TC/armv7a-linux-androideabi21-clang"  ;;
              arm64-v8a)   CC="$NDK_TC/aarch64-linux-android21-clang"     ;;
              x86_64)      CC="$NDK_TC/x86_64-linux-android21-clang"      ;;
            esac

            CFLAGS="-std=c99 -O2 -fPIC -ffunction-sections -fdata-sections \
              -DANDROID -DPLATFORM_ANDROID -DGRAPHICS_API_OPENGL_ES2 \
              -D__ANDROID_API__=21 \
              -I$RAYLIB_SRC/src \
              -I$RAYLIB_SRC/src/external/glfw/include \
              --sysroot=$SYSROOT"

            OBJS=""
            for CF in $RAYLIB_C_FILES; do
              OBJ="$OBJ_DIR/${CF%.c}.o"
              echo "  Compiling $CF..."
              $CC $CFLAGS -c "$RAYLIB_SRC/src/$CF" -o "$OBJ"
              OBJS="$OBJS $OBJ"
            done

            # Archive into static lib
            AR="$NDK_TC/llvm-ar"
            $AR rcs "raylib-prebuilt/$ABI/libraylib.a" $OBJS
            echo "✅ $ABI: $(ls -lh raylib-prebuilt/$ABI/libraylib.a)"
          done

      - name: Prepare JNI sources
        run: |
          JNI=build-android/app/src/main/jni
          mkdir -p "$JNI/src"
          cp -r src/world    "$JNI/src/"
          cp -r src/player   "$JNI/src/"
          cp -r src/renderer "$JNI/src/"
          cp -r src/input    "$JNI/src/"
          cp -r src/ui       "$JNI/src/"
          cp    src/main.c   "$JNI/src/"

          # Copy prebuilt raylib into jni tree (CMakeLists expects it here)
          cp -r raylib-prebuilt "$JNI/raylib-prebuilt"

          mkdir -p build-android/app/src/main/assets
          cp -r assets/. build-android/app/src/main/assets/ 2>/dev/null || true

          echo "JNI tree:"
          find "$JNI" -name "*.c" | sort
          echo "Raylib libs:"
          find "$JNI/raylib-prebuilt" -name "*.a" -exec ls -lh {} \;

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore build-android/mc2d-release.keystore \
            -alias mc2d -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=MC2D,OU=ArnabLabZ,O=GAX,L=Dhaka,ST=Dhaka,C=BD"

      - name: Write gradle.properties
        run: |
          cat > build-android/gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          RELEASE_STORE_FILE=mc2d-release.keystore
          RELEASE_KEY_ALIAS=mc2d
          RELEASE_STORE_PASSWORD=android123
          RELEASE_KEY_PASSWORD=android123
          EOF

      - name: Setup Gradle wrapper
        working-directory: build-android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version=8.6
          fi
          chmod +x gradlew

      - name: Build Release APKs
        working-directory: build-android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.ndkVersion=${{ env.NDK_VERSION }} \
            --no-daemon --stacktrace
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Rename APKs
        run: |
          DIR=build-android/app/build/outputs/apk/release
          for f in "$DIR"/*.apk; do
            base=$(basename "$f")
            mv "$f" "$DIR/MC2D-r${{ github.run_number }}-${base#app-}"
          done
          ls -lh "$DIR"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build-android/app/build/outputs/apk/release/*.apk
          retention-days: 30

# ================================================================
# JOB 3: GitHub Release (tag only)
# ================================================================
  create-release:
    name: "🚀 GitHub Release"
    runs-on: ubuntu-22.04
    needs: [build-web, build-android]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-apks/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MC2D ${{ github.ref_name }}"
          body: |
            ## ⛏ MC2D — ${{ github.ref_name }}
            **ArnabLabZ Studio (GamerArnabXYZ)**

            | Platform | ABI | Notes |
            |----------|-----|-------|
            | Android  | arm64-v8a | Most modern devices |
            | Android  | armeabi-v7a | Older 32-bit ARM |
            | Android  | x86_64 | Emulator |
            | Android  | Universal | All ABIs |
            | Web/WASM | — | [▶ Play Now](https://gamerarnabxyz.github.io/mc_2d) |

            **Stack:** C99 · Raylib ${{ env.RAYLIB_TAG }} · Emscripten 3.1.64 · NDK 26.3
          draft: false
          prerelease: false
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
