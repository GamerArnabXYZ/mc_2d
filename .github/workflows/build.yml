name: MC2D Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NDK_VERSION: "26.3.11579264"
  RAYLIB_VERSION: "4.5.0"
  EMSCRIPTEN_VERSION: "3.1.64"

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Build Raylib for Android (all ABIs)
  # ──────────────────────────────────────────────────────────────
  build-raylib-android:
    name: Build Raylib Android
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;${{ env.NDK_VERSION }} cmake;3.22.1"

      - name: Clone Raylib ${{ env.RAYLIB_VERSION }}
        run: |
          git clone --depth 1 --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git /tmp/raylib

      - name: Build Raylib for ${{ matrix.abi }}
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}
          mkdir -p /tmp/raylib/build_${{ matrix.abi }}
          cd /tmp/raylib/build_${{ matrix.abi }}
          cmake ../src \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DPLATFORM=Android \
            -DGRAPHICS=GRAPHICS_API_OPENGL_ES2
          make -j$(nproc)
          mkdir -p ${{ github.workspace }}/libs/raylib_android/${{ matrix.abi }}
          cp libraylib.a ${{ github.workspace }}/libs/raylib_android/${{ matrix.abi }}/
          mkdir -p ${{ github.workspace }}/libs/raylib_android/include
          cp /tmp/raylib/src/raylib.h ${{ github.workspace }}/libs/raylib_android/include/
          cp /tmp/raylib/src/raymath.h ${{ github.workspace }}/libs/raylib_android/include/
          cp /tmp/raylib/src/rlgl.h    ${{ github.workspace }}/libs/raylib_android/include/

      - name: Upload Raylib ${{ matrix.abi }}
        uses: actions/upload-artifact@v4
        with:
          name: raylib-android-${{ matrix.abi }}
          path: libs/raylib_android/

  # ──────────────────────────────────────────────────────────────
  # 2. Android APK
  # ──────────────────────────────────────────────────────────────
  build-android:
    name: Android APK
    needs: build-raylib-android
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;${{ env.NDK_VERSION }} cmake;3.22.1 build-tools;34.0.0 platforms;android-34"

      - name: Download Raylib arm64-v8a
        uses: actions/download-artifact@v4
        with:
          name: raylib-android-arm64-v8a
          path: libs/raylib_android/

      - name: Download Raylib armeabi-v7a
        uses: actions/download-artifact@v4
        with:
          name: raylib-android-armeabi-v7a
          path: libs/raylib_android/

      - name: Download Raylib x86_64
        uses: actions/download-artifact@v4
        with:
          name: raylib-android-x86_64
          path: libs/raylib_android/

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore ${{ github.workspace }}/debug.keystore \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=ArnabLabZ, OU=Dev, O=ArnabLabZ, L=BD, S=BD, C=BD" 2>/dev/null || true
          mkdir -p android/app
          cp ${{ github.workspace }}/debug.keystore android/app/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          # Use gradle wrapper if present, else system gradle
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          find android -name "*.apk" -exec cp {} mc2d-debug.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MC2D-APK
          path: mc2d-debug.apk
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # 3. WebAssembly build
  # ──────────────────────────────────────────────────────────────
  build-web:
    name: WebAssembly (WASM)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten ${{ env.EMSCRIPTEN_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          cd /opt/emsdk
          ./emsdk install  ${{ env.EMSCRIPTEN_VERSION }}
          ./emsdk activate ${{ env.EMSCRIPTEN_VERSION }}

      - name: Build Raylib for WASM
        run: |
          source /opt/emsdk/emsdk_env.sh
          git clone --depth 1 --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git /tmp/raylib
          mkdir /tmp/raylib/build_wasm && cd /tmp/raylib/build_wasm
          emcmake cmake ../src \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DPLATFORM=Web \
            -DGRAPHICS=GRAPHICS_API_OPENGL_ES2
          emmake make -j$(nproc)
          mkdir -p ${{ github.workspace }}/libs/raylib_web
          cp libraylib.a ${{ github.workspace }}/libs/raylib_web/
          cp /tmp/raylib/src/raylib.h ${{ github.workspace }}/libs/raylib_web/
          cp /tmp/raylib/src/raymath.h ${{ github.workspace }}/libs/raylib_web/
          cp /tmp/raylib/src/rlgl.h    ${{ github.workspace }}/libs/raylib_web/

      - name: Compile MC2D to WASM
        run: |
          source /opt/emsdk/emsdk_env.sh
          mkdir -p web_out
          emcc \
            src/main.c \
            src/world/worldgen.c \
            src/physics/physics.c \
            src/renderer/renderer.c \
            src/input/input.c \
            src/player/player.c \
            src/ui/ui.c \
            src/utils/noise.c \
            -std=c99 -O2 \
            -Isrc \
            -I${{ github.workspace }}/libs/raylib_web \
            -DPLATFORM_WEB \
            -DGRAPHICS_API_OPENGL_ES2 \
            -s WASM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=67108864 \
            -s MAX_MEMORY=268435456 \
            -s USE_GLFW=3 \
            -s FULL_ES2=1 \
            -s ASYNCIFY \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            --shell-file web/shell.html \
            ${{ github.workspace }}/libs/raylib_web/libraylib.a \
            -lm \
            -o web_out/index.html

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: MC2D-Web
          path: web_out/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # 4. Deploy Web to GitHub Pages
  # ──────────────────────────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: MC2D-Web
          path: ./gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
