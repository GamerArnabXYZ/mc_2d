name: Build Web (WASM) + Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: emsdk
          key: emsdk-3.1.51

      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.51
          ./emsdk activate 3.1.51

      - name: Generate texture atlas
        run: |
          pip install Pillow -q
          python3 tools/gen_atlas.py assets/textures/atlas.png

      - name: Configure (emcmake)
        run: |
          source emsdk/emsdk_env.sh
          mkdir -p build-web
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM
        run: |
          source emsdk/emsdk_env.sh
          emmake cmake --build build-web --config Release -j$(nproc)

      - name: Package web output
        run: |
          mkdir -p web-dist
          for ext in html js wasm data; do
            [ -f "build-web/CraftSDL.$ext" ] && cp "build-web/CraftSDL.$ext" web-dist/ || true
          done
          [ -f web-dist/CraftSDL.html ] && mv web-dist/CraftSDL.html web-dist/index.html || true
          ls -lh web-dist/

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraftSDL-web
          path: web-dist/
          retention-days: 30

      - name: Deploy to web branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web
          publish_dir: web-dist
          force_orphan: true
          commit_message: "Deploy web build [skip ci]"
