name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ── Android APK ─────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" 2>&1 | tail -3

      - name: Cache SDL2 deps
        uses: actions/cache@v4
        id: sdl-cache
        with:
          path: deps
          key: sdl2-deps-2.28.5

      - name: Download SDL2 sources
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz \
            | tar -xz -C deps && mv deps/SDL2-2.28.5 deps/SDL2
          curl -fsSL https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.2/SDL2_image-2.8.2.tar.gz \
            | tar -xz -C deps && mv deps/SDL2_image-2.8.2 deps/SDL2_image
          curl -fsSL https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0.tar.gz \
            | tar -xz -C deps && mv deps/SDL2_ttf-2.22.0 deps/SDL2_ttf

      - name: Setup SDL2 Java sources
        run: |
          mkdir -p android/app/src/main/java
          cp -r deps/SDL2/android-project/app/src/main/java/. android/app/src/main/java/

      - name: Generate launcher icons
        run: |
          pip install Pillow -q
          python3 - << 'ICONEOF'
from PIL import Image, ImageDraw
import os
sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
base = 'android/app/src/main/res'
for folder, size in sizes.items():
    path = f'{base}/{folder}/ic_launcher.png'
    os.makedirs(os.path.dirname(path), exist_ok=True)
    img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
    draw = ImageDraw.Draw(img)
    m = size // 8
    draw.rounded_rectangle([m, m, size-m, size-m], radius=size//5, fill=(76, 153, 0, 255))
    cx, cy, t = size//2, size//2, max(2, size//16)
    draw.rectangle([cx-t, cy-size//3, cx+t, cy+size//3], fill=(255,255,255,255))
    draw.rectangle([cx-size//3, cy-t, cx+size//3, cy+t], fill=(255,255,255,255))
    img.save(path, 'PNG')
ICONEOF

      - name: Generate texture atlas
        run: pip install Pillow -q && python3 tools/gen_atlas.py assets/textures/atlas.png

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-install
          /tmp/gradle-install/gradle-8.7/bin/gradle wrapper --gradle-version=8.7
          chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find android -name "*.apk" | head -1 | xargs -I{} cp {} artifacts/CraftSDL-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/CraftSDL-android.apk

  # ── Web WASM ────────────────────────────────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: emsdk
          key: emsdk-3.1.51

      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 3.1.51 && ./emsdk activate 3.1.51

      - name: Generate texture atlas
        run: pip install Pillow -q && python3 tools/gen_atlas.py assets/textures/atlas.png

      - name: Configure + Build WASM
        run: |
          source emsdk/emsdk_env.sh
          mkdir -p build-web
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          emmake cmake --build build-web --config Release -j$(nproc)

      - name: Package web output
        run: |
          mkdir -p web-dist
          for ext in html js wasm data; do
            [ -f "build-web/CraftSDL.$ext" ] && cp "build-web/CraftSDL.$ext" web-dist/ || true
          done
          [ -f web-dist/CraftSDL.html ] && mv web-dist/CraftSDL.html web-dist/index.html || true

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web-dist/

  # ── GitHub Release ───────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-web]

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Get version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create release ZIPs
        run: |
          mkdir -p release-bundle
          # APK
          cp release-files/android-apk/CraftSDL-android.apk release-bundle/

          # Web ZIP
          cd release-files/web-build
          zip -r ../../release-bundle/CraftSDL-web.zip .
          cd ../..

          # Source ZIP (exclude build artifacts and deps)
          zip -r release-bundle/CraftSDL-source.zip . \
            --exclude ".git/*" "build-*/*" "deps/*" "emsdk/*" \
            --exclude "release-files/*" "release-bundle/*" \
            --exclude "*.apk" "*.zip"

          # Full bundle
          cd release-bundle
          zip CraftSDL-full-bundle.zip \
            CraftSDL-android.apk CraftSDL-web.zip CraftSDL-source.zip
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: "CraftSDL ${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## CraftSDL ${{ steps.get_version.outputs.VERSION }}
            ### 📦 Downloads
            | File | Platform |
            |------|----------|
            | `CraftSDL-android.apk` | Android 5.0+ (arm64, armeabi-v7a, x86_64) |
            | `CraftSDL-web.zip` | Web/WASM — extract and serve with any HTTP server |
            | `CraftSDL-source.zip` | Full C++ source |
            | `CraftSDL-full-bundle.zip` | All of the above |

            ### 🕹️ Controls
            **Mobile:** Left joystick = move/jump · Right tap = place · Right hold = break · Top-right = inventory
            **Desktop:** WASD/Arrows = move · Space = jump · LMB = break · RMB = place · E = inventory · 1–9 / Scroll = slot

            ### 🌐 Web Hosting
            Extract `CraftSDL-web.zip`, serve the folder with any HTTP server.
            Live demo: Check the `web` branch → GitHub Pages.
          files: |
            release-bundle/CraftSDL-android.apk
            release-bundle/CraftSDL-web.zip
            release-bundle/CraftSDL-source.zip
            release-bundle/CraftSDL-full-bundle.zip

      # Deploy web to GitHub Pages
      - name: Deploy to web branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web
          publish_dir: release-files/web-build
          force_orphan: true
          commit_message: "Deploy ${{ steps.get_version.outputs.VERSION }} [skip ci]"
