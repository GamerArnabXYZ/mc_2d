<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MC Clone - Infinite 2D World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0f1a;
        }

        #game-canvas {
            border: 2px solid #333;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
        }

        #controls {
            background: rgba(30, 30, 50, 0.95);
            padding: 20px;
            text-align: center;
            border-top: 2px solid #444;
        }

        .control-section {
            display: inline-block;
            margin: 0 20px;
            vertical-align: top;
        }

        h2 {
            color: #4fc3f7;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .key {
            display: inline-block;
            background: #333;
            padding: 8px 14px;
            border-radius: 4px;
            margin: 4px;
            font-weight: bold;
            border: 1px solid #555;
            min-width: 40px;
        }

        .key-group {
            margin: 8px 0;
        }

        .key-label {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-text {
            color: #4fc3f7;
            font-size: 24px;
            margin-top: 20px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #333;
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-box {
            background: #ff4444;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px;
            max-width: 500px;
            text-align: center;
        }

        #mobile-controls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            pointer-events: none;
        }

        .joystick-container {
            position: absolute;
            bottom: 50px;
            left: 30px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
        }

        .joystick-base {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
        }

        .joystick-thumb {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(79, 195, 247, 0.8);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .action-buttons {
            position: absolute;
            bottom: 50px;
            right: 30px;
            pointer-events: auto;
        }

        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
            margin: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
        }

        .jump-btn {
            background: rgba(76, 175, 80, 0.6);
        }

        .attack-btn {
            background: rgba(244, 67, 54, 0.6);
        }

        @media (max-width: 768px) {
            #mobile-controls {
                display: block;
            }
            #controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading MC Clone...</div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
    </div>

    <div id="controls">
        <div class="control-section">
            <h2>Desktop Controls</h2>
            <div class="key-group">
                <div class="key-label">Movement</div>
                <span class="key">A</span>
                <span class="key">D</span>
                <span class="key">←</span>
                <span class="key">→</span>
            </div>
            <div class="key-group">
                <div class="key-label">Actions</div>
                <span class="key">Space</span> Jump
                <span class="key">Shift</span> Sprint
            </div>
        </div>
        <div class="control-section">
            <h2>Game Info</h2>
            <p style="color: #aaa; font-size: 14px;">
                Infinite procedural world<br>
                Press ESC to pause
            </p>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="joystick-container" id="joystick">
            <div class="joystick-base">
                <div class="joystick-thumb" id="joystick-thumb"></div>
            </div>
        </div>
        <div class="action-buttons">
            <button class="action-btn jump-btn" id="jump-btn">↑</button>
            <button class="action-btn attack-btn" id="attack-btn">⚔</button>
        </div>
    </div>

    <script>
        // Module loading
        var Module = {
            canvas: (function() {
                var canvas = document.getElementById('game-canvas');
                canvas.addEventListener('webglcontextlost', function(e) {
                    alert('WebGL context lost. Please reload.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            onRuntimeInitialized: function() {
                console.log('MC Clone engine initialized');
                document.getElementById('loading').style.display = 'none';
            },
            setStatus: function(text) {
                if (text) {
                    document.querySelector('.loading-text').textContent = text;
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                var status = left ?
                    'Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' :
                    'All downloads complete.';
                this.setStatus(status);
            }
        };

        // WASM loading would be:
        // var script = document.createElement('script');
        // script.src = 'mc-clone.js';
        // document.body.appendChild(script);

        // Fallback: Show demo message
        setTimeout(function() {
            if (document.getElementById('loading').style.display !== 'none') {
                document.getElementById('loading').innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h1 style="color: #4fc3f7; font-size: 32px;">MC Clone Engine</h1>
                        <p style="color: #aaa; margin: 20px 0;">WebAssembly build not yet compiled.</p>
                        <p style="color: #666; font-size: 14px;">
                            To run in browser:<br>
                            1. Run <code>make web</code> locally<br>
                            2. Host with a web server<br>
                            3. Deploy to GitHub Pages
                        </p>
                        <div style="margin-top: 30px; padding: 20px; background: rgba(79, 195, 247, 0.1); border-radius: 8px;">
                            <p style="color: #4fc3f7;">Features:</p>
                            <ul style="text-align: left; color: #aaa; line-height: 1.8;">
                                <li>16x16 Chunk System with Perlin Noise</li>
                                <li>Zero-Crash Texture Fallback</li>
                                <li>AABB Physics + Gravity</li>
                                <li>Cross-Platform: Desktop/Web/Android</li>
                            </ul>
                        </div>
                    </div>
                `;
            }
        }, 2000);

        // Mobile touch controls (for future touch input)
        if ('ontouchstart' in window) {
            var joystick = document.getElementById('joystick');
            var thumb = document.getElementById('joystick-thumb');
            var jumpBtn = document.getElementById('jump-btn');
            var attackBtn = document.getElementById('attack-btn');

            // Joystick handling
            var joystickActive = false;
            var joystickCenter = { x: 0, y: 0 };

            joystick.addEventListener('touchstart', function(e) {
                e.preventDefault();
                joystickActive = true;
                var rect = joystick.getBoundingClientRect();
                joystickCenter.x = rect.left + rect.width / 2;
                joystickCenter.y = rect.top + rect.height / 2;
            });

            joystick.addEventListener('touchmove', function(e) {
                e.preventDefault();
                if (!joystickActive) return;

                var touch = e.touches[0];
                var dx = touch.clientX - joystickCenter.x;
                var dy = touch.clientY - joystickCenter.y;
                var distance = Math.sqrt(dx * dx + dy * dy);
                var maxRadius = 50;

                if (distance > maxRadius) {
                    dx = dx / distance * maxRadius;
                    dy = dy / distance * maxRadius;
                }

                thumb.style.left = 'calc(50% + ' + dx + 'px)';
                thumb.style.top = 'calc(50% + ' + dy + 'px)';

                // Send input to game (would call emscripten function)
                console.log('Joystick:', dx / maxRadius, dy / maxRadius);
            });

            joystick.addEventListener('touchend', function(e) {
                joystickActive = false;
                thumb.style.left = '50%';
                thumb.style.top = '50%';
            });

            // Button handling
            jumpBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                // Send jump input to game
                console.log('Jump pressed');
            });

            attackBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                // Send attack input to game
                console.log('Attack pressed');
            });
        }

        console.log('MC Clone Web Demo loaded');
    </script>
</body>
</html>
